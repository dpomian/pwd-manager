name: Run Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v3
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: 0.5.20

    - name: Install dependencies
      run: uv sync

    - name: Run tests
      run: uv run pytest tests/
      env:
        SECRET_KEY: test-secret-key
